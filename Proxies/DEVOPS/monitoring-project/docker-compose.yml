services:

  nginx:
    build: ./nginx
    container_name: nginx
    ports:
      - "8080:80"
    depends_on:
      - sandbox-backend

  prometheus:
    image: prom/prometheus
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus

  grafana:
    image: grafana/grafana
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_ANONYMOUS_ORG_NAME=Main Org.
    volumes:
      - grafana-storage:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter
    container_name: nginx-exporter
    command:
      - "-nginx.scrape-uri=http://nginx/status"
    ports:
      - "9113:9113"
    depends_on:
      - nginx

  postgres:
    image: postgres:15-alpine
    container_name: postgres
    environment:
      POSTGRES_USER: sandbox_user
      POSTGRES_PASSWORD: sandbox_password
      POSTGRES_DB: sandbox_db
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sandbox_user -d sandbox_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  sandbox-backend:
    build: ./sandbox-backend
    container_name: sandbox-backend
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=sandbox_user
      - DB_PASSWORD=sandbox_password
      - DB_NAME=sandbox_db
      - PORT=8080
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  grafana-storage:
  prometheus-data:
  postgres-data: